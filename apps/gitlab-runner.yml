apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.gitlab.io'
    chart: gitlab-runner
    targetRevision: 0.70.0
    helm:
      values: |
        gitlabUrl: https://gitlab.com/
        runnerRegisterToken: "glrt-ytW_-oRxzmnF-sjPaMwpj2M6MQpvOjEKcDoxZ2psOHcKdDozCnU6cTRlZDIc.01.1o0m1ak44"
        runners:
          config: |
            [[runners]]
              [runners.kubernetes]
                namespace = "gitlab-runner"
                privileged = true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
