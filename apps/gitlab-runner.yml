apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.gitlab.io'
    chart: gitlab-runner
    targetRevision: 0.70.0
    helm:
      values: |
        gitlabUrl: https://gitlab.com/
        runnerToken: "glrt-ytW_-oRxzmnF-sjPaWpj2M6MQpv0jEKcDoxZ2ps0HckdDozCnU6cTRlZD1c.01.la0m1ak44"
        runners:
          config: |
            [[runners]]
              [runners.kubernetes]
                namespace = "gitlab-runner"
                privileged = true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
