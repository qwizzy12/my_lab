- name: Обновить кэш apt
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Установить системные пакеты-зависимости для k3s и ArgoCD
  ansible.builtin.apt:
    name:
      - curl
      - sudo
      - ca-certificates
      - apt-transport-https
      - gnupg
    state: present

